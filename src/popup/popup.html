<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>TO Coords</h1>
  <p>Карта открывается в отдельном окне при входе в бой. Если окно закрыто — кнопка ниже или <code>M</code> в игре.</p>
  <ul>
    <li><code>+</code> / <code>−</code> — масштаб карты</li>
    <li><code>Shift</code> + <code>+</code> / <code>−</code> — камера в паркуре</li>
  </ul>
  <button id="open-map">Открыть карту</button>
  <a href="https://tankionline.com/play/" target="_blank">Играть</a>
  <script src="popup.js"></script>
</body>
</html>
