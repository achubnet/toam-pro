<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Карта</title>
  <link rel="stylesheet" href="window.css">
</head>
<body>
  <nav id="tabs">
    <button data-tab="map">Карта</button>
  </nav>
  <main id="pages">
    <section class="tab" data-tab="map">
      <canvas id="map"></canvas>
      <div id="info" hidden></div>
      <div id="banner" hidden><strong></strong><span></span></div>
    </section>
  </main>
  <footer id="panel">
    <div class="group">
      <span class="label">Карта</span>
      <button data-zoom="0.8" title="Отдалить">−</button>
      <button data-zoom="1.25" title="Приблизить">+</button>
    </div>
    <label class="switch" title="Карта поворачивается за направлением прицела: всё, что впереди, — сверху"><input type="checkbox" data-view="rotate"><span>Прикрепить камеру</span></label>
    <label class="switch" title="Стрелка выше или ниже тебя возле каждой метки"><input type="checkbox" data-view="heights"><span>Высота</span></label>
    <label class="switch" title="Метки под перекрытием полупрозрачные"><input type="checkbox" data-view="roofs"><span>Под крышей</span></label>
    <label class="switch"><input type="checkbox" data-view="health"><span>Здоровье</span></label>
    <label class="switch"><input type="checkbox" data-view="names"><span>Ники</span></label>
    <label class="switch"><input type="checkbox" data-view="info"><span>Инфо</span></label>
    <div id="controls"></div>
    <label class="switch" title="Нажатия клавиш в этом окне передаются дальше"><input type="checkbox" data-view="keys"><span>Управление</span></label>
    <div id="summary"></div>
    <div id="status"></div>
  </footer>
  <script src="../shared/map-geometry.js"></script>
  <script src="map-layers.js"></script>
  <script src="map-hud.js"></script>
  <script src="map-renderer.js"></script>
  <script src="info-view.js"></script>
  <script src="feed-view.js"></script>
  <script src="table-view.js"></script>
  <script src="window.js"></script>
</body>
</html>
